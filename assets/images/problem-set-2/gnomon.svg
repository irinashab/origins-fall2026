<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc"><title id="title">Two shaded versions of a gnomon</title><desc id="desc">Two identical arrangements. The top has an a by b rectangle shaded. The bottom has an L-shaped region shaded inside a square of side (a+b)/2, outside a square of side (a-b)/2.</desc><rect width="760" height="760" fill="white"/><g font-family="Georgia, serif" font-size="22" fill="#202830"><rect x="70" y="95" width="400" height="80" fill="#b8c8d9"/><path d="M70,95 H550 V335 H310 V175 H70 Z M310,95 V175 H550 M470,95 V335" fill="none" stroke="#202830" stroke-width="2"/><path d="M70,73 L470,73" fill="none" stroke="#687583"/><path d="M66,68 L74,78 M466,68 L474,78" stroke="#687583"/><text x="270" y="60" text-anchor="middle">a</text><path d="M470,73 L550,73" fill="none" stroke="#687583"/><path d="M466,68 L474,78 M546,68 L554,78" stroke="#687583"/><text x="510" y="60" text-anchor="middle">b</text><path d="M70,195 L310,195" fill="none" stroke="#687583"/><path d="M66,190 L74,200 M306,190 L314,200" stroke="#687583"/><text x="190" y="222" text-anchor="middle">(a + b)/2</text><path d="M570,95 L570,175" fill="none" stroke="#687583"/><path d="M566,90 L574,100 M566,170 L574,180" stroke="#687583"/><text x="598" y="142" text-anchor="middle">b</text><path d="M570,175 L570,335" fill="none" stroke="#687583"/><path d="M566,170 L574,180 M566,330 L574,340" stroke="#687583"/><text x="646" y="262" text-anchor="middle">(a − b)/2</text><path d="M310,445 H550 V685 H470 V525 H310 Z" fill="#b8c8d9"/><path d="M70,445 H550 V685 H310 V525 H70 Z M310,445 V525 H550 M470,445 V685" fill="none" stroke="#202830" stroke-width="2"/><path d="M70,423 L470,423" fill="none" stroke="#687583"/><path d="M66,418 L74,428 M466,418 L474,428" stroke="#687583"/><text x="270" y="410" text-anchor="middle">a</text><path d="M470,423 L550,423" fill="none" stroke="#687583"/><path d="M466,418 L474,428 M546,418 L554,428" stroke="#687583"/><text x="510" y="410" text-anchor="middle">b</text><path d="M70,545 L310,545" fill="none" stroke="#687583"/><path d="M66,540 L74,550 M306,540 L314,550" stroke="#687583"/><text x="190" y="572" text-anchor="middle">(a + b)/2</text><path d="M570,445 L570,525" fill="none" stroke="#687583"/><path d="M566,440 L574,450 M566,520 L574,530" stroke="#687583"/><text x="598" y="492" text-anchor="middle">b</text><path d="M570,525 L570,685" fill="none" stroke="#687583"/><path d="M566,520 L574,530 M566,680 L574,690" stroke="#687583"/><text x="646" y="612" text-anchor="middle">(a − b)/2</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img" aria-labelledby="title desc"><title id="title">Mapping one plus i to one plus two i</title><desc id="desc">Two coordinate planes show the input one plus i and its output one plus two i under f of z equals z squared plus one.</desc><defs><marker id="245ba8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#245ba8"/></marker><marker id="368535" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#368535"/></marker><marker id="b83f38" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#b83f38"/></marker><marker id="8053a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8053a1"/></marker><marker id="64748b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="470" y="32" text-anchor="middle" font-size="24" fill="#17212d">A function maps one complex plane to another</text><text x="470" y="76" text-anchor="middle" font-size="23" fill="#17212d">f(z) = z² + 1</text><path d="M95,412.5 L95,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M140,412.5 L140,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M185,412.5 L185,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M230,412.5 L230,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M275,412.5 L275,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M320,412.5 L320,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M365,412.5 L365,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,390 L365,390" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,345 L365,345" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,300 L365,300" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,255 L365,255" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,210 L365,210" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,165 L365,165" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M95,300 L365,300" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#64748b)"/><path d="M230,412.5 L230,142.5" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#64748b)"/><text x="230" y="125" text-anchor="middle" font-size="20" fill="#17212d">Input z = x + iy</text><text x="140" y="320" text-anchor="middle" font-size="13" fill="#17212d">-2</text><text x="216" y="395" text-anchor="middle" font-size="13" fill="#17212d">-2</text><text x="185" y="320" text-anchor="middle" font-size="13" fill="#17212d">-1</text><text x="216" y="350" text-anchor="middle" font-size="13" fill="#17212d">-1</text><text x="275" y="320" text-anchor="middle" font-size="13" fill="#17212d">1</text><text x="216" y="260" text-anchor="middle" font-size="13" fill="#17212d">1</text><text x="320" y="320" text-anchor="middle" font-size="13" fill="#17212d">2</text><text x="216" y="215" text-anchor="middle" font-size="13" fill="#17212d">2</text><circle cx="275" cy="255" r="5.5" fill="#245ba8" stroke="white" stroke-width="1.5"/><text x="287" y="240" text-anchor="start" font-size="22" fill="#245ba8">1 + i</text><text x="375" y="320" text-anchor="middle" font-size="18" fill="#17212d">x</text><text x="248" y="140" text-anchor="middle" font-size="18" fill="#17212d">y</text><path d="M575,412.5 L575,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M620,412.5 L620,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M665,412.5 L665,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M710,412.5 L710,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M755,412.5 L755,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M800,412.5 L800,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M845,412.5 L845,142.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,390 L845,390" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,345 L845,345" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,300 L845,300" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,255 L845,255" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,210 L845,210" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,165 L845,165" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M575,300 L845,300" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#64748b)"/><path d="M710,412.5 L710,142.5" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#64748b)"/><text x="710" y="125" text-anchor="middle" font-size="20" fill="#17212d">Output w = u + iv</text><text x="620" y="320" text-anchor="middle" font-size="13" fill="#17212d">-2</text><text x="696" y="395" text-anchor="middle" font-size="13" fill="#17212d">-2</text><text x="665" y="320" text-anchor="middle" font-size="13" fill="#17212d">-1</text><text x="696" y="350" text-anchor="middle" font-size="13" fill="#17212d">-1</text><text x="755" y="320" text-anchor="middle" font-size="13" fill="#17212d">1</text><text x="696" y="260" text-anchor="middle" font-size="13" fill="#17212d">1</text><text x="800" y="320" text-anchor="middle" font-size="13" fill="#17212d">2</text><text x="696" y="215" text-anchor="middle" font-size="13" fill="#17212d">2</text><circle cx="755" cy="210" r="5.5" fill="#245ba8" stroke="white" stroke-width="1.5"/><text x="767" y="195" text-anchor="start" font-size="22" fill="#245ba8">1 + 2i</text><text x="855" y="320" text-anchor="middle" font-size="18" fill="#17212d">u</text><text x="728" y="140" text-anchor="middle" font-size="18" fill="#17212d">v</text><path d="M400,280 L535,280" fill="none" stroke="#245ba8" stroke-width="3" marker-end="url(#245ba8)"/><text x="470" y="263" text-anchor="middle" font-size="20" fill="#245ba8">f</text><text x="470" y="470" text-anchor="middle" font-size="21" fill="#17212d">(1 + i)² + 1 = 1 + 2i + i² + 1 = 1 + 2i</text></g></svg>
" font-size="20" fill="#17212d">f</text><text x="480" y="495" text-anchor="middle" font-size="20" fill="#17212d">(x + i)² + 1 = x² + 2xi:  u = x²,  v = 2x.</text><text x="480" y="530" text-anchor="middle" font-size="17" fill="#17212d">Matching colors track the same input and output; as x increases, v increases.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">A horizontal line mapped to a parabola</title><desc id="desc">The line y equals one maps under z squared plus one to the parabola u equals v squared over four. Five colored points show corresponding inputs and outputs.</desc><defs><marker id="245ba8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#245ba8"/></marker><marker id="368535" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#368535"/></marker><marker id="b83f38" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#b83f38"/></marker><marker id="8053a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8053a1"/></marker><marker id="64748b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="480" y="32" text-anchor="middle" font-size="24" fill="#17212d">A straight input line becomes a parabola</text><text x="480" y="70" text-anchor="middle" font-size="22" fill="#17212d">f(z) = z² + 1, with z = x + i</text><path d="M110,367.5 L110,147.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M165,367.5 L165,147.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M220,367.5 L220,147.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M275,367.5 L275,147.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M330,367.5 L330,147.5" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M66.0,340 L374.0,340" fill="none" stroke="#e2e8f0" stroke-width="1"/><path d="M66.0,285 L374.0,285" fill="none" st
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="title desc"><title id="title">Scaling and sign on the real line</title><desc id="desc">Three examples: three times three is nine; three times negative two is negative six; negative three times negative three is nine.</desc><defs><marker id="245ba8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#245ba8"/></marker><marker id="368535" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#368535"/></marker><marker id="b83f38" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#b83f38"/></marker><marker id="8053a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8053a1"/></marker><marker id="64748b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="450" y="32" text-anchor="middle" font-size="25" fill="#17212d">Multiplication on the real line</text><text x="450" y="80" text-anchor="middle" font-size="19" fill="#17212d">Positive factor: scale, preserve direction</text><path d="M80,145 L780,145" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#64748b)"/><path d="M151,141 L151,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="151" y="171" text-anchor="middle" font-size="15" fill="#17212d">-6</text><path d="M253,141 L253,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="253" y="171" text-anchor="middle" font-size="15" fill="#17212d">-3</text><path d="M355,141 L355,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="355" y="171" text-anchor="middle" font-size="15" fill="#17212d">0</text><path d="M457,141 L457,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="457" y="171" text-anchor="middle" font-size="15" fill="#17212d">3</text><path d="M559,141 L559,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="559" y="171" text-anchor="middle" font-size="15" fill="#17212d">6</text><path d="M661,141 L661,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="661" y="171" text-anchor="middle" font-size="15" fill="#17212d">9</text><path d="M763,141 L763,149" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="763" y="171" text-anchor="middle" font-size="15" fill="#17212d">12</text><path d="M355,129 L457,129" fill="none" stroke="#245ba8" stroke-width="4" marker-end="url(#245ba8)"/><path d="M355,189 L661,189" fill="none" stroke="#b83f38" stroke-width="4" marker-end="url(#b83f38)"/><text x="835" y="140" text-anchor="middle" font-size="21" fill="#17212d">× (3)</text><text x="835" y="169" text-anchor="middle" font-size="18" fill="#17212d">3 → 9</text><text x="100" y="126" text-anchor="middle" font-size="14" fill="#245ba8">input</text><text x="100" y="194" text-anchor="middle" font-size="14" fill="#b83f38">output</text><text x="450" y="250" text-anchor="middle" font-size="19" fill="#17212d">Negative factor: scale and reverse direction</text><path d="M80,315 L780,315" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#64748b)"/><path d="M151,311 L151,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="151" y="341" text-anchor="middle" font-size="15" fill="#17212d">-6</text><path d="M253,311 L253,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="253" y="341" text-anchor="middle" font-size="15" fill="#17212d">-3</text><path d="M355,311 L355,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="355" y="341" text-anchor="middle" font-size="15" fill="#17212d">0</text><path d="M457,311 L457,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="457" y="341" text-anchor="middle" font-size="15" fill="#17212d">3</text><path d="M559,311 L559,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="559" y="341" text-anchor="middle" font-size="15" fill="#17212d">6</text><path d="M661,311 L661,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="661" y="341" text-anchor="middle" font-size="15" fill="#17212d">9</text><path d="M763,311 L763,319" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="763" y="341" text-anchor="middle" font-size="15" fill="#17212d">12</text><path d="M355,299 L457,299" fill="none" stroke="#245ba8" stroke-width="4" marker-end="url(#245ba8)"/><path d="M355,359 L151,359" fill="none" stroke="#b83f38" stroke-width="4" marker-end="url(#b83f38)"/><text x="835" y="310" text-anchor="middle" font-size="21" fill="#17212d">× (-2)</text><text x="835" y="339" text-anchor="middle" font-size="18" fill="#17212d">3 → -6</text><text x="100" y="296" text-anchor="middle" font-size="14" fill="#245ba8">input</text><text x="100" y="364" text-anchor="middle" font-size="14" fill="#b83f38">output</text><text x="450" y="420" text-anchor="middle" font-size="19" fill="#17212d">Negative × negative: reverse again</text><path d="M80,485 L780,485" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#64748b)"/><path d="M151,481 L151,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="151" y="511" text-anchor="middle" font-size="15" fill="#17212d">-6</text><path d="M253,481 L253,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="253" y="511" text-anchor="middle" font-size="15" fill="#17212d">-3</text><path d="M355,481 L355,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="355" y="511" text-anchor="middle" font-size="15" fill="#17212d">0</text><path d="M457,481 L457,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="457" y="511" text-anchor="middle" font-size="15" fill="#17212d">3</text><path d="M559,481 L559,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="559" y="511" text-anchor="middle" font-size="15" fill="#17212d">6</text><path d="M661,481 L661,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="661" y="511" text-anchor="middle" font-size="15" fill="#17212d">9</text><path d="M763,481 L763,489" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="763" y="511" text-anchor="middle" font-size="15" fill="#17212d">12</text><path d="M355,469 L253,469" fill="none" stroke="#245ba8" stroke-width="4" marker-end="url(#245ba8)"/><path d="M355,529 L661,529" fill="none" stroke="#b83f38" stroke-width="4" marker-end="url(#b83f38)"/><text x="835" y="480" text-anchor="middle" font-size="21" fill="#17212d">× (-3)</text><text x="835" y="509" text-anchor="middle" font-size="18" fill="#17212d">-3 → 9</text><text x="100" y="466" text-anchor="middle" font-size="14" fill="#245ba8">input</text><text x="100" y="534" text-anchor="middle" font-size="14" fill="#b83f38">output</text><text x="450" y="610" text-anchor="middle" font-size="17" fill="#17212d">Arrow lengths show magnitude; arrow direction shows sign.</text></g></svg>